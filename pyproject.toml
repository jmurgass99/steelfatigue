[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steelfatigue"
version = "1.1.1"
description = "Fatigue and brittle fracture checks for structural steel: EN 1993-1-9 trilinear S-N curve and Palmgren-Miner damage, EN 1993-1-10 maximum thickness, ASTM E1049 rainflow, mean-stress correction, IIW hot-spot and notch stress, Paris crack growth, Coffin-Manson low-cycle fatigue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["fatigue", "fatigue-analysis", "structural-steel", "structural-engineering", "eurocode-3", "EN-1993-1-9", "EN-1993-1-10", "detail-category", "s-n-curve", "palmgren-miner", "brittle-fracture", "rainflow", "ASTM-E1049", "hot-spot-stress", "IIW", "mean-stress", "paris-law", "crack-growth", "low-cycle-fatigue", "coffin-manson"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "fatpack>=0.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
]
memos = [
    "handcalcs>=1.6",
]

[project.urls]
Homepage = "https://github.com/jmurgass99/steelfatigue"
Repository = "https://github.com/jmurgass99/steelfatigue"
Issues = "https://github.com/jmurgass99/steelfatigue/issues"

[tool.setuptools.packages.find]
include = ["steelfatigue*"]

[tool.setuptools.package-data]
steelfatigue = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: pruebas unitarias rapidas",
    "integration: pruebas de integracion",
    "api: pruebas de endpoints REST",
]

[tool.coverage.run]
source = ["steelfatigue"]
branch = true
omit = ["*/__pycache__/*", "*/_brand.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
